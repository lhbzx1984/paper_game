services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      COOKIE_SECURE: "1"
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 中填写 DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/entrypoint.sh:/deploy/entrypoint.sh:ro
      - ./deploy/nginx/default.conf.template:/deploy/default.conf.template:ro
      - ./deploy/nginx/http-only.conf.template:/deploy/http-only.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "/deploy/entrypoint.sh"]

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
